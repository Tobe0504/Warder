# Warder on Render.
#
# Two services from one image, because Warder has two HTTP surfaces and Render
# gives a service exactly one public port. Collapsing them onto one port would
# throw away the separation the whole design rests on: the admin surface trusts
# a service credential the dashboard holds, and the runtime surface trusts no
# shared credential at all, because every workload would have to carry it.
#
#   warder-admin     the dashboard's backend talks to this
#   warder-runtime   the ward CLI and deployed workloads talk to this
#
# Each service binds its own surface to Render's $PORT and leaves the other on
# loopback, where nothing outside the container can reach it.
#
# First deploy, in order:
#   1. Create a Postgres database somewhere that does not expire and copy its
#      connection string (see docs/deployment.md).
#   2. Run the migration once, from your machine:
#        WARDER_DATABASE_URL="…" warder-api migrate
#   3. Push this file. In Render: New → Blueprint → pick the repo.
#   4. Render creates both services and stops at the values marked sync:false
#      below. Fill them in; both services need the same three.
#
# The database is NOT defined here. Render's free Postgres is deleted after
# thirty days, which is a poor property for the store holding every secret an
# organization owns, and a surprising one to discover when it happens. Bring
# your own Postgres instead and paste its connection string into
# WARDER_DATABASE_URL on both services. Neon's free tier does not expire; so
# does Supabase's. See docs/deployment.md.

services:
  # -------------------------------------------------------------------------
  # Admin surface: the dashboard's backend
  # -------------------------------------------------------------------------
  - type: web
    name: warder-admin
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: WARDER_ENV
        value: production

      # This service publishes the admin surface and keeps the runtime
      # listener on loopback, unreachable from outside the container.
      - key: WARDER_ADMIN_ADDR
        value: 0.0.0.0:10000
      - key: WARDER_RUNTIME_ADDR
        value: 127.0.0.1:8081
      - key: PORT
        value: 10000

      # Render terminates TLS and forwards the caller's address in
      # X-Forwarded-For. Without this, every rate limit and every audit entry
      # records the load balancer instead of the client.
      - key: WARDER_TRUST_PROXY_HEADERS
        value: "true"

      # Your Postgres. Both services read the same ciphertext, so both take
      # the same connection string. Use the POOLED endpoint if your provider
      # offers one: these are two services on free instances, and a pooler is
      # what keeps them inside a shared connection budget.
      - key: WARDER_DATABASE_URL
        sync: false

      # Set once, by hand, and never rotated casually: every secret in the
      # system is encrypted under this. Generate with `warder-api keygen`.
      - key: WARDER_KEYRING
        sync: false

      # Shared with the dashboard's WARDER_URL. Nothing else may hold it.
      - key: WARDER_SERVICE_TOKEN
        sync: false

      # Passkeys are bound to the dashboard's domain, not this service's.
      # Leave both unset to keep passkeys off. RP_ID is the bare host
      # (app.example.com); ORIGINS is the full origin(s), comma-separated
      # (https://app.example.com).
      - key: WARDER_WEBAUTHN_RP_ID
        sync: false
      - key: WARDER_WEBAUTHN_ORIGINS
        sync: false

  # -------------------------------------------------------------------------
  # Runtime surface: the ward CLI and deployed workloads
  # -------------------------------------------------------------------------
  - type: web
    name: warder-runtime
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health

    envVars:
      - key: WARDER_ENV
        value: production

      # The mirror image: runtime surface public, admin on loopback. A stolen
      # machine token reaching this service cannot touch the human-facing API
      # even if it learns the address, because that listener is not bound to
      # anything the internet can address.
      - key: WARDER_RUNTIME_ADDR
        value: 0.0.0.0:10000
      - key: WARDER_ADMIN_ADDR
        value: 127.0.0.1:8080
      - key: PORT
        value: 10000

      # Binding every interface is the only option inside a container. Render's
      # load balancer decides what reaches this port; saying so explicitly is
      # what the config guard asks for.
      - key: WARDER_ALLOW_PUBLIC_RUNTIME_BIND
        value: "true"

      - key: WARDER_TRUST_PROXY_HEADERS
        value: "true"

      # Your Postgres. Both services read the same ciphertext, so both take
      # the same connection string. Use the POOLED endpoint if your provider
      # offers one: these are two services on free instances, and a pooler is
      # what keeps them inside a shared connection budget.
      - key: WARDER_DATABASE_URL
        sync: false

      # The same keyring as the admin service. Two processes, one set of keys:
      # they are reading the same ciphertext.
      - key: WARDER_KEYRING
        sync: false

      # Present because the binary requires it at startup, and unused on this
      # surface: the runtime handler has no service-token middleware. Give it
      # the same value as the admin service.
      - key: WARDER_SERVICE_TOKEN
        sync: false
