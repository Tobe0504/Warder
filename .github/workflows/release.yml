name: Release

# Publishes the `ward` CLI when a version tag is pushed.
#
# The CLI is the only artifact developers install on their own machines, so it
# is the only one built here. The API and the dashboard are deployed from a
# container image by whoever runs them, not downloaded by individuals.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build ward
    runs-on: ubuntu-latest

    # Writing a release is the one thing this workflow needs beyond reading.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          check-latest: true

      - name: Verify module checksums
        run: go mod verify

      # A release that ships a binary failing its own tests is worse than no
      # release. The database-backed tests are skipped here; CI already runs
      # them on every push to main.
      - name: Test
        run: go test ./...

      - name: Build every platform
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # CGO off, so each binary is static and runs on any machine of its
          # architecture without matching a libc.
          export CGO_ENABLED=0

          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="ward_${VERSION}_${os}_${arch}"

            # -trimpath removes local filesystem paths from the binary.
            # -s -w drop the symbol and DWARF tables, which nobody debugging a
            # released build has access to anyway.
            GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/Tobe0504/Warder/internal/cli.Version=${VERSION}" \
              -o "dist/${name}/ward" \
              ./cmd/ward

            tar -czf "dist/${name}.tar.gz" -C "dist/${name}" ward
            rm -rf "dist/${name}"
          done

          # One checksum file covering every archive. The install script
          # verifies against this, so a tampered download fails loudly.
          cd dist && sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
